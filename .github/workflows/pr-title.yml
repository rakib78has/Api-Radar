name: PR title

# Pull-request titles become the squash-merge commit message, which release-please reads to
# choose the next version and write CHANGELOG.md. They must follow Conventional Commits,
# e.g. "feat: add HAR import" or "fix(extension): keep triage after reload".
on:
  # pull_request_target also works for pull requests from forks. This job never checks out or
  # runs pull-request code; it only reads the title through the API.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the title "{title}" should start with a lower-case letter,
            e.g. "feat: add HAR import".
