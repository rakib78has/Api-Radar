name: Release

# Builds a draft release from a version tag. Nothing is published to the Chrome
# Web Store: a maintainer reviews the draft, downloads the zip and uploads it.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Passed through the environment, never interpolated into scripts; release:check
      # rejects anything that is not vMAJOR.MINOR.PATCH before it is used.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Tag, versions and changelog agree
        run: pnpm release:check

      - name: Quality gates (format, lint, typecheck, icons, tests with coverage, build, manifest)
        run: pnpm check

      - name: Security gates
        run: pnpm security

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Extension E2E
        run: pnpm test:e2e

      - name: Regression scenarios
        run: pnpm test:regression

      - name: Package and load the release zip in Chromium
        run: pnpm test:package

      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: release/
          retention-days: 30
          if-no-files-found: error

  draft:
    name: Create the draft release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Add required reviewers to this environment (Settings -> Environments -> release)
    # so that every release needs a maintainer's approval before the draft is created.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Download the verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package
          path: release/

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: node scripts/check-release.ts "$RELEASE_TAG" release/release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/api-qa-inspector-*.zip

      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "API QA Inspector $version" \
            --notes-file release/release-notes.md \
            "release/api-qa-inspector-$version.zip" \
            "release/api-qa-inspector-$version.files.txt" \
            release/SHA256SUMS
