name: Release

# Release flow (see docs/ci-cd.md):
# 1. Every push to main updates a release PR (release-please) that bumps the versions and
#    writes CHANGELOG.md from Conventional Commit messages.
# 2. Merging that PR tags vX.Y.Z and creates a draft GitHub release.
# 3. The same run verifies the tagged commit (every gate), packages the extension, waits for
#    approval in the `release` environment, attaches the zip, checksums and provenance, and
#    publishes the release.
# 4. Optionally, after a second approval (`chrome-web-store` environment), it submits the zip
#    to the Chrome Web Store for review. This runs only when the store is configured.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and attach assets for, e.g. v0.1.0
        required: true

permissions:
  contents: read

# One release run at a time; a queued run waits instead of cancelling a release in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR or tag
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Optional: with a GitHub App, the release PR triggers CI like any other PR. Without one,
      # GitHub does not run workflows for PRs opened with GITHUB_TOKEN.
      - name: GitHub App token (optional)
        id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Update the release PR, or tag and draft the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    name: Verify and package
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Later jobs only see their direct dependencies, so the resolved tag is passed on here.
    outputs:
      tag: ${{ env.RELEASE_TAG }}
    env:
      # Passed through the environment, never interpolated into scripts; release:check
      # rejects anything that is not vMAJOR.MINOR.PATCH before it is used.
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Tag, versions and changelog agree
        run: pnpm release:check

      - name: Quality gates (format, lint, typecheck, icons, tests with coverage, build, manifest)
        run: pnpm check

      - name: Security gates
        run: pnpm security

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Extension E2E
        run: pnpm test:e2e

      - name: Regression scenarios
        run: pnpm test:regression

      - name: Package and load the release zip in Chromium
        run: pnpm test:package

      - name: Release notes for a manually dispatched tag
        run: node scripts/check-release.ts "$RELEASE_TAG" release/release-notes.md

      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: release/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Attach assets and publish
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Add required reviewers (Settings -> Environments -> release) so that a person approves
    # every release before it is published.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package
          path: release/

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/api-qa-inspector-*.zip

      - name: Attach the assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=(
            "release/api-qa-inspector-$version.zip"
            "release/api-qa-inspector-$version.files.txt"
            release/SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "API QA Inspector $version" --notes-file release/release-notes.md "${assets[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Published $RELEASE_TAG: $(gh release view "$RELEASE_TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  chrome-web-store:
    name: Submit to the Chrome Web Store
    needs: [verify, publish]
    # Runs only once the store is configured: repository variables CWS_PUBLISHER_ID and
    # CWS_EXTENSION_ID, plus the CWS_* secrets (see docs/ci-cd.md).
    if: ${{ !cancelled() && needs.publish.result == 'success' && vars.CWS_EXTENSION_ID != '' && vars.CWS_PUBLISHER_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download the verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package
          path: release/

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Upload and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
        run: node scripts/publish-chrome-web-store.ts "release/api-qa-inspector-${RELEASE_TAG#v}.zip"
